version: "3.9"

services:

  chatbot:

    build: .

    container_name: ai_chatbot

    ports:
      - "8501:8501"

    volumes:
      - .:/app

    env_file:
      - .env

    depends_on:
      - ollama

    restart: unless-stopped

  ollama:

    image: ollama/ollama

    container_name: ollama

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    restart: unless-stopped

volumes:

  ollama_data: