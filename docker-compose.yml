services:

  chatbot:
    build: .
    container_name: ai_chatbot

    ports:
      - "8501:8501"

    depends_on:
      - ollama
      - chromadb

    volumes:
      - .:/app

    env_file:
      - .env

  ollama:
    image: ollama/ollama

    container_name: ollama

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

  chromadb:
    image: chromadb/chroma:latest

    container_name: chromadb

    ports:
      - "8000:8000"

    volumes:
      - chroma_data:/chroma/chroma

    environment:
      - IS_PERSISTENT=TRUE

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - chatbot

volumes:

  ollama_data:

  chroma_data:

  redis_data: