services:

  chatbot:
    build: .
    container_name: ai_chatbot

    ports:
      - "8501:8501"

    depends_on:
      - ollama
      - chromadb

    volumes:
      - .:/app

    env_file:
      - .env

  ollama:
    image: ollama/ollama

    container_name: ollama

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

  chromadb:
    image: chromadb/chroma:latest

    container_name: chromadb

    ports:
      - "8000:8000"

    volumes:
      - chroma_data:/chroma/chroma

    environment:
      - IS_PERSISTENT=TRUE

volumes:

  ollama_data:

  chroma_data: